
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1e">
<title>ARYA AI</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#080f1e;
 --panel:#101a2c;
 --border:rgba(255,255,255,.09);
 --blue:#60a5fa;
 --text:#eef4ff;
 --muted:#8b9ab3;
}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
 height:100dvh;
 display:flex;
 flex-direction:column;
}
header{
 height:65px;
 padding:0 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--border);
 background:#0b1425;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:37px;height:37px;border-radius:12px;
 background:linear-gradient(135deg,#2563eb,#60a5fa);
 display:grid;place-items:center;
 font-weight:bold;font-size:17px;
 box-shadow:0 0 20px #2563eb55;
}
.brand-name{font-size:17px;font-weight:700}
.status{font-size:11px;color:#55d6a5;margin-top:3px}
.header-actions{display:flex;gap:8px}
.icon-btn{
 border:1px solid var(--border);
 background:#142137;color:#dce8fa;
 width:38px;height:38px;border-radius:11px;
 display:grid;place-items:center;cursor:pointer;
}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg,.control-btn svg{
 width:19px;height:19px;fill:none;
 stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round;
}
main{
 flex:1;min-height:0;overflow-y:auto;
 padding:18px 14px 22px;
}
.chat{
 max-width:760px;margin:auto;
 display:flex;flex-direction:column;gap:17px;
}
.welcome{
 text-align:center;padding:30px 12px 24px;
}
.welcome-logo{
 width:68px;height:68px;margin:auto auto 15px;
 border-radius:22px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#2563eb,#60a5fa);
 box-shadow:0 0 40px #2563eb33;
 font-size:25px;font-weight:bold;
}
.welcome h1{font-size:24px;margin:0 0 8px}
.welcome p{font-size:14px;color:var(--muted);line-height:1.6}
.message{
 display:flex;gap:9px;align-items:flex-start;
}
.message.user{justify-content:flex-end}
.avatar{
 flex:0 0 30px;height:30px;border-radius:10px;
 background:#172b48;display:grid;place-items:center;
 color:#93c5fd;font-size:12px;font-weight:bold;
}
.bubble{
 max-width:85%;padding:12px 14px;
 border:1px solid var(--border);
 border-radius:15px;background:var(--panel);
 font-size:15px;line-height:1.65;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.user .bubble{
 background:#17345b;border-color:#254c7b;
 border-radius:15px 5px 15px 15px;
}
.bot .bubble{border-radius:5px 15px 15px 15px}
.typing{color:var(--muted);font-size:14px}
footer{
 padding:10px 12px calc(12px + env(safe-area-inset-bottom));
 background:#0b1425;border-top:1px solid var(--border);
}
.footer-inner{max-width:760px;margin:auto}
.input-wrap{
 display:flex;align-items:flex-end;gap:8px;
 background:#111d30;border:1px solid #24344d;
 border-radius:17px;padding:8px;
}
#messageInput{
 flex:1;min-width:0;max-height:120px;min-height:42px;
 resize:none;border:0;outline:0;background:transparent;
 color:white;font-size:16px;padding:11px 5px;
 font-family:inherit;
}
#messageInput::placeholder{color:#71829c}
.control-btn{
 height:42px;min-width:42px;border:1px solid var(--border);
 border-radius:12px;background:#1a2a42;color:#dce8fa;
 display:grid;place-items:center;cursor:pointer;
}
.control-btn:active{transform:scale(.96)}
.send-btn{
 background:linear-gradient(135deg,#2563eb,#3b82f6);
 border:0;color:white;
}
.mic-btn.listening{
 background:#a92d45;border-color:#ff7188;
 color:white;animation:pulse 1.2s infinite;
}
@keyframes pulse{
 50%{box-shadow:0 0 0 5px #ef444433}
}
.language-btn{
 min-width:44px;height:42px;padding:0 9px;
 border-radius:12px;background:#1b2a42;
 border:1px solid #345173;color:#93c5fd;
 font-weight:bold;font-size:12px;cursor:pointer;
}
.language-btn:active{transform:scale(.96)}
.tools{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:9px 3px 0;
}
.tool-group{display:flex;gap:8px;align-items:center}
.tool{
 display:flex;align-items:center;gap:6px;
 color:var(--muted);font-size:12px;
 background:none;border:0;padding:5px;cursor:pointer;
}
.tool.active{color:#60a5fa}
.tool svg{width:16px;height:16px;fill:none;
 stroke:currentColor;stroke-width:1.8}
.note{text-align:center;color:#64748b;font-size:10px;margin-top:8px}
@media(min-width:600px){
 main{padding:24px}
 .welcome{padding-top:48px}
 .bubble{font-size:15.5px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">A</div>
  <div>
   <div class="brand-name">ARYA AI</div>
   <div class="status">● Online Assistant</div>
  </div>
 </div>

 <div class="header-actions">
  <button class="icon-btn" onclick="newChat()" title="New Chat">
   <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" onclick="clearChat()" title="Clear Chat">
   <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
  </button>
 </div>
</header>

<main id="mainArea">
 <div class="chat" id="chat">

  <div class="welcome" id="welcome">
   <div class="welcome-logo">A</div>
   <h1>नमस्ते, मैं ARYA हूँ</h1>
   <p>आपका AI असिस्टेंट।<br>
   मुझसे हिंदी या English में बात कर सकते हैं।</p>
  </div>

 </div>
</main>

<footer>
 <div class="footer-inner">

  <div class="input-wrap">
   <textarea id="messageInput" rows="1"
    placeholder="अपना संदेश लिखें..."
    aria-label="Message"></textarea>

   <!-- Language toggle: HI / EN -->
   <button class="language-btn" id="languageBtn"
    onclick="toggleLanguage()" title="Microphone language">
    HI
   </button>

   <!-- Microphone -->
   <button class="control-btn mic-btn" id="micBtn"
    onclick="startListening()" title="Speak">
    <svg viewBox="0 0 24 24">
     <rect x="9" y="3" width="6" height="12" rx="3"/>
     <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
    </svg>
   </button>

   <!-- Send -->
   <button class="control-btn send-btn" onclick="sendMessage()"
    title="Send">
    <svg viewBox="0 0 24 24">
     <path d="M4 12 20 4 15 20l-3-7-8-1Z"/>
     <path d="M12 13 20 4"/>
    </svg>
   </button>
  </div>

  <div class="tools">
   <div class="tool-group">
    <button class="tool active" id="voiceBtn" onclick="toggleVoice()">
     <svg viewBox="0 0 24 24">
      <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
      <path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>
     </svg>
     <span>Voice ON</span>
    </button>

    <button class="tool" onclick="stopSpeaking()">
     <svg viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
     </svg>
     <span>Stop</span>
    </button>
   </div>

   <div class="tool-group">
    <span id="languageStatus" style="font-size:11px;color:#8b9ab3">
     Mic: Hindi
    </span>
   </div>
  </div>

  <div class="note">ARYA AI can make mistakes. Verify important information.</div>
 </div>
</footer>

<script>
const API_URL = "https://arya-backend-2.onrender.com/chat";

let voiceEnabled = true;
let currentLanguage = "hi-IN";
let recognition = null;
let isListening = false;
let isSending = false;

const chat = document.getElementById("chat");
const mainArea = document.getElementById("mainArea");
const messageInput = document.getElementById("messageInput");
const micBtn = document.getElementById("micBtn");
const languageBtn = document.getElementById("languageBtn");
const languageStatus = document.getElementById("languageStatus");
const voiceBtn = document.getElementById("voiceBtn");

/* HI / EN language switch */
function toggleLanguage(){
 if(isListening && recognition){
  try{recognition.stop()}catch(e){}
 }
 currentLanguage =
  currentLanguage === "hi-IN" ? "en-IN" : "hi-IN";

 updateLanguageUI();
}

function updateLanguageUI(){
 if(currentLanguage === "hi-IN"){
  languageBtn.textContent = "HI";
  languageStatus.textContent = "Mic: Hindi";
 }else{
  languageBtn.textContent = "EN";
  languageStatus.textContent = "Mic: English";
 }
}

/* Add messages to chat */
function addMessage(text, type){
 const welcome = document.getElementById("welcome");
 if(welcome) welcome.remove();

 const row = document.createElement("div");
 row.className = "message " + type;

 if(type === "bot"){
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "A";
  row.appendChild(avatar);
 }

 const bubble = document.createElement("div");
 bubble.className = "bubble";
 bubble.textContent = text;
 row.appendChild(bubble);

 chat.appendChild(row);
 mainArea.scrollTop = mainArea.scrollHeight;
 return bubble;
}

function showTyping(){
 const bubble = addMessage("ARYA सोच रहा है...", "bot");
 bubble.classList.add("typing");
 return bubble;
}

/* Speech output */
function speak(text){
 if(!voiceEnabled || !("speechSynthesis" in window)) return;

 window.speechSynthesis.cancel();

 const speech = new SpeechSynthesisUtterance(text);

 // Reply language based on the reply text
 speech.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-IN";
 speech.rate = 0.94;
 speech.pitch = 1.05;

 const voices = window.speechSynthesis.getVoices();
 const matching = voices.filter(v =>
  v.lang && v.lang.toLowerCase().startsWith(
   speech.lang.toLowerCase().slice(0,2)
  )
 );

 if(matching.length){
  speech.voice = matching[0];
 }

 window.speechSynthesis.speak(speech);
}

/* Voice ON / OFF */
function toggleVoice(){
 voiceEnabled = !voiceEnabled;

 const span = voiceBtn.querySelector("span");
 span.textContent = voiceEnabled ? "Voice ON" : "Voice OFF";

 voiceBtn.classList.toggle("active", voiceEnabled);

 if(!voiceEnabled){
  stopSpeaking();
 }
}

/* Stop speech */
function stopSpeaking(){
 if("speechSynthesis" in window){
  window.speechSynthesis.cancel();
 }
}

/* Send chat */
async function sendMessage(textFromMic){
 if(isSending) return;

 const text = (textFromMic || messageInput.value).trim();
 if(!text) return;

 messageInput.value = "";
 messageInput.style.height = "42px";

 addMessage(text, "user");
 isSending = true;

 const typingBubble = showTyping();

 try{
  const response = await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Server error");
  }

  const answer =
   data.reply || data.response || data.message ||
   "मुझे जवाब नहीं मिला।";

  typingBubble.classList.remove("typing");
  typingBubble.textContent = answer;

  if(voiceEnabled) speak(answer);

 }catch(error){
  typingBubble.classList.remove("typing");
  typingBubble.textContent =
   "माफ़ कीजिए, अभी जवाब नहीं मिल पाया। इंटरनेट या सर्वर की समस्या हो सकती है।";
  console.error(error);
 }finally{
  isSending = false;
  mainArea.scrollTop = mainArea.scrollHeight;
 }
}

/* Mic language selection */
function startListening(){
 if(isListening){
  try{recognition.stop()}catch(e){}
  return;
 }

 const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  addMessage(
   "इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है। Chrome में खोलकर कोशिश करें।",
   "bot"
  );
  return;
 }

 recognition = new SpeechRecognition();
 recognition.lang = currentLanguage;
 recognition.continuous = false;
 recognition.interimResults = false;
 recognition.maxAlternatives = 1;

 recognition.onstart = function(){
  isListening = true;
  micBtn.classList.add("listening");
 };

 recognition.onresult = function(event){
  const transcript = event.results[0][0].transcript;
  messageInput.value = transcript;
  sendMessage(transcript);
 };

 recognition.onerror = function(event){
  console.log("Mic error:",event.error);

  if(event.error !== "no-speech" && event.error !== "aborted"){
   addMessage("आवाज़ पहचानने में समस्या हुई। भाषा HI/EN चुनकर फिर कोशिश करें।","bot");
  }
 };

 recognition.onend = function(){
  isListening = false;
  micBtn.classList.remove("listening");
 };

 try{
  recognition.start();
 }catch(error){
  isListening = false;
  micBtn.classList.remove("listening");
 }
}

/* Clear current chat */
function clearChat(){
 chat.innerHTML = "";
 addMessage("चैट साफ़ कर दी गई है। बताइए, मैं आपकी क्या मदद कर सकता हूँ?","bot");
}

/* New chat */
function newChat(){
 chat.innerHTML = "";

 const welcome = document.createElement("div");
 welcome.className = "welcome";
 welcome.id = "welcome";
 welcome.innerHTML = `
  <div class="welcome-logo">A</div>
  <h1>नमस्ते, मैं ARYA हूँ</h1>
  <p>आपका AI असिस्टेंट।<br>
  मुझसे हिंदी या English में बात कर सकते हैं।</p>
 `;
 chat.appendChild(welcome);

 messageInput.value = "";
 stopSpeaking();
}

/* Enter to send, Shift+Enter for new line */
messageInput.addEventListener("keydown",function(e){
 if(e.key === "Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

/* Auto resize text area */
messageInput.addEventListener("input",function(){
 this.style.height = "42px";
 this.style.height = Math.min(this.scrollHeight,120)+"px";
});

updateLanguageUI();
</script>

</body>
                             </html>
