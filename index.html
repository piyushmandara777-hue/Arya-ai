<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYA AI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}
header {
  padding: 25px;
  background: #17243a;
}
h1 { color: #42d9ff; }
#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}
.message {
  background: #243650;
  padding: 12px;
  margin: 10px;
  border-radius: 12px;
  text-align: left;
}
input {
  width: 65%;
  padding: 13px;
  border-radius: 10px;
  border: none;
}
button {
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #42d9ff;
}
</style>
</head>
<body>
<header>
<h1>✨ ARYA AI</h1>
<p>Your Personal AI Assistant</p>
</header>
<div id="chat">
<div class="message">
नमस्ते! मैं ARYA हूँ। बताओ, मैं तुम्हारी क्या मदद करूँ?
</div>
</div>
<input id="msg" placeholder="यहाँ अपना संदेश लिखो...">
<button onclick="sendMessage()">Send</button>
<script>
function send(){
 const q = input.value.trim();
 if(!q) return;

 addMessage(q,"user");
 input.value = "";

 const hindi = /[\u0900-\u097F]/.test(q);

 if(hindi){
   addMessage(
     "नमस्ते! मैं ARYA हूँ। आपका सवाल मुझे मिल गया है। मैं हिंदी में आपकी सहायता करने के लिए तैयार हूँ।",
     "bot"
   );
 } else {
   addMessage(
     "Hello! I am ARYA. I have received your question and I am ready to assist you in English.",
     "bot"
   );
 }
}
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if (!text) return;
  let chat = document.getElementById("chat");
  let message = document.createElement("div");
  message.className = "message";
  message.textContent = "तुम: " + text;
  chat.appendChild(message);
  let reply = document.createElement("div");
  reply.className = "message";
  reply.textContent = "ARYA: नमस्ते! तुम्हारा संदेश मिल गया। मैं अभी अपना AI सिस्टम सीख रहा हूँ।";
  chat.appendChild(reply);
  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
  </html>
