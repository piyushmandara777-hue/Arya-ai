
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101522;
 color:white;
}
header{
 padding:20px;
 text-align:center;
 background:#18243a;
 border-bottom:1px solid #34445e;
}
header h1{margin:0;color:#54d6ff}
header p{margin:7px 0 0;color:#b9c7da}
#chat{
 max-width:750px;
 margin:auto;
 padding:15px;
 height:65vh;
 overflow-y:auto;
}
.message{
 padding:13px;
 margin:12px 0;
 border-radius:12px;
 line-height:1.5;
 white-space:pre-wrap;
}
.user{background:#245b82;margin-left:35px}
.bot{background:#263249;margin-right:35px}
footer{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:12px;
 background:#18243a;
 display:flex;
 gap:8px;
}
input{
 flex:1;
 min-width:0;
 padding:14px;
 border-radius:10px;
 border:1px solid #52627b;
 background:#101522;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 background:#19b9e8;
 color:#061522;
 font-weight:bold;
}
#status{
 text-align:center;
 color:#9eabc0;
 padding:8px;
}
</style>
</head>
<body>
<header>
<h1>ARYA AI</h1>
<p>Your Personal AI Assistant</p>
</header>

<div id="status">ARYA तैयार है</div>
<div id="chat">
<div class="message bot">नमस्ते! मैं ARYA हूँ। मुझसे हिंदी या English में कुछ भी पूछिए।</div>
</div>

<footer>
<input id="message" placeholder="अपना सवाल लिखें..." />
<button onclick="sendMessage()">Send</button>
</footer>

<script>
const API_URL = "https://arya-backend-2.onrender.com/chat";

async function sendMessage(){
 const input=document.getElementById("message");
 const chat=document.getElementById("chat");
 const status=document.getElementById("status");
 const message=input.value.trim();

 if(!message)return;

 addMessage(message,"user");
 input.value="";
 status.textContent="ARYA सोच रही है...";

 const loading=addMessage("जवाब तैयार हो रहा है...","bot");

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.reply || "Server error");
  }

  loading.textContent=data.reply || "जवाब नहीं मिला।";
  status.textContent="ARYA ऑनलाइन है";

 }catch(error){
  loading.textContent="माफ़ कीजिए, अभी जवाब नहीं मिल पाया। कृपया थोड़ी देर बाद कोशिश करें।";
  status.textContent="कनेक्शन में समस्या";
 }
}

function addMessage(text,type){
 const chat=document.getElementById("chat");
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

document.getElementById("message").addEventListener("keydown",function(e){
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
  </html>
