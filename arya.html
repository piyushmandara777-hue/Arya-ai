<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1e">
<title>ARYA AI | Personal Assistant</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#080f1e;
 --panel:#111c30;
 --panel2:#172640;
 --border:#293c59;
 --blue:#54d6ff;
 --text:#edf5ff;
 --muted:#9eafc7;
}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}
button{
 border:1px solid var(--border);
 background:var(--panel2);
 color:white;
 border-radius:11px;
 padding:10px 14px;
 cursor:pointer;
 font-weight:600;
}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{
 background:var(--blue);
 color:#061522;
 border-color:var(--blue);
}
header{
 height:68px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 background:#101b2d;
 border-bottom:1px solid var(--border);
}
.brand h1{
 margin:0;
 color:var(--blue);
 font-size:22px;
 letter-spacing:2px;
}
.brand small{color:var(--muted);font-size:10px;letter-spacing:2px}
.header-actions{display:flex;gap:7px;align-items:center}
#status{
 color:#9eafc7;
 font-size:12px;
 text-align:center;
 padding:9px;
}
.modebar{
 display:flex;
 justify-content:center;
 gap:8px;
 padding:8px;
}
.modebar button.active{
 color:#061522;
 background:var(--blue);
 border-color:var(--blue);
}
#chatMode{
 display:flex;
 flex-direction:column;
 height:calc(100dvh - 160px);
 max-width:850px;
 margin:auto;
}
#chat{
 flex:1;
 overflow-y:auto;
 padding:14px;
 padding-bottom:20px;
}
.message{
 padding:13px 15px;
 margin:12px 0;
 border-radius:14px;
 line-height:1.65;
 overflow-wrap:anywhere;
}
.user{
 background:#245b82;
 margin-left:35px;
 white-space:pre-wrap;
}
.bot{
 background:#1a2941;
 margin-right:35px;
}
.bot p{margin:8px 0 12px}
.bot h1,.bot h2,.bot h3{color:var(--blue)}
.bot h1{font-size:23px}
.bot h2{font-size:20px}
.bot h3{font-size:17px}
.bot ul,.bot ol{padding-left:24px}
.bot li{margin:6px 0}
.bot a{color:var(--blue);overflow-wrap:anywhere}
.bot blockquote{
 border-left:3px solid var(--blue);
 padding:8px 12px;
 background:#111d30;
}
.bot code{background:#101a2b;padding:3px 5px;border-radius:5px}
.bot pre{
 background:#0b1423;
 padding:12px;
 border-radius:9px;
 overflow:auto;
}
.bot pre code{background:none}
.bot table{border-collapse:collapse;width:100%;font-size:14px}
.bot td,.bot th{border:1px solid #40516b;padding:7px}
.bot th{color:var(--blue)}
.sources{
 margin-top:13px;
 padding-top:10px;
 border-top:1px solid var(--border);
}
.sources strong{color:var(--blue)}
.sources a{
 display:block;
 margin:7px 0;
 font-size:13px;
}
.composer{
 display:flex;
 gap:8px;
 padding:12px;
 background:#101b2d;
 border-top:1px solid var(--border);
}
.composer input{
 flex:1;
 min-width:0;
 background:#080f1e;
 border:1px solid var(--border);
 border-radius:12px;
 padding:14px;
 color:white;
 font-size:16px;
 outline:none;
}
.composer input:focus{border-color:var(--blue)}
.iconbtn{min-width:45px}
#voiceMode{
 display:none;
 height:calc(100dvh - 160px);
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:20px;
 text-align:center;
}
#voiceMode.active{display:flex}
.core-area{
 width:270px;
 height:270px;
 display:grid;
 place-items:center;
 position:relative;
 margin:15px auto 25px;
}
.core{
 width:135px;
 height:135px;
 border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#b4f4ff,#32aeea 35%,#07518f 75%,#061b38);
 box-shadow:0 0 35px #25b9ff99,0 0 90px #168dff55;
 animation:corePulse 3s ease-in-out infinite;
}
.ring{
 position:absolute;
 border:1px solid #54d6ff66;
 border-radius:50%;
 width:205px;height:205px;
 animation:spin 9s linear infinite;
}
.ring.two{
 width:255px;height:255px;
 border-style:dashed;
 animation:spin 16s linear infinite reverse;
}
.ring.three{
 width:285px;height:285px;
 border-color:#54d6ff22;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{
 0%,100%{transform:scale(.94);filter:brightness(.9)}
 50%{transform:scale(1.07);filter:brightness(1.3)}
}
body.listening .core{
 box-shadow:0 0 55px #28e6ff,0 0 120px #168dff;
 animation:corePulse .8s infinite;
}
body.speaking .core{
 box-shadow:0 0 65px #8a7dff,0 0 130px #5b55ff;
}
.voice-title{font-size:22px;color:var(--blue);margin:10px}
.voice-hint{color:var(--muted);font-size:14px;max-width:300px}
.voice-controls{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:10px;
 margin-top:18px;
}
.voice-controls button{min-width:90px}
#voiceTranscript{
 min-height:25px;
 max-width:420px;
 color:#b9cce5;
 margin-top:14px;
 overflow-wrap:anywhere;
}
#historyPanel{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#0009;
}
#historyPanel.open{display:block}
.drawer{
 width:min(340px,88vw);
 height:100%;
 background:#101b2d;
 border-right:1px solid var(--border);
 padding:18px;
 overflow:auto;
}
.drawer-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.history-item{
 padding:12px;
 background:#192942;
 border-radius:10px;
 margin:8px 0;
 cursor:pointer;
 overflow-wrap:anywhere;
}
.history-item small{color:var(--muted)}
#memoryPanel{
 display:none;
 position:fixed;
 inset:0;
 z-index:12;
 background:#000a;
 align-items:center;
 justify-content:center;
 padding:15px;
}
#memoryPanel.open{display:flex}
.modal{
 background:#142239;
 border:1px solid var(--border);
 border-radius:15px;
 padding:18px;
 width:min(420px,100%);
}
.modal textarea{
 width:100%;
 min-height:110px;
 resize:vertical;
 padding:12px;
 background:#080f1e;
 color:white;
 border:1px solid var(--border);
 border-radius:10px;
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media(max-width:600px){
 header{padding:0 10px}
 .brand h1{font-size:19px}
 .brand small{font-size:8px}
 .header-actions button{padding:9px;font-size:12px}
 .user{margin-left:18px}
 .bot{margin-right:18px}
 .core-area{transform:scale(.88);margin:0 auto 5px}
 #chatMode{height:calc(100dvh - 155px)}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <h1>ARYA AI</h1>
  <small>PERSONAL INTELLIGENCE</small>
 </div>
 <div class="header-actions">
  <button onclick="openHistory()">History</button>
  <button onclick="newChat()">New Chat</button>
 </div>
</header>

<div class="modebar">
 <button id="chatModeBtn" class="active" onclick="switchMode('chat')">Chat</button>
 <button id="voiceModeBtn" onclick="switchMode('voice')">Voice Mode</button>
 <button onclick="openMemory()">Memory</button>
</div>

<div id="status">ARYA तैयार है</div>

<section id="chatMode">
 <div id="chat">
  <div class="message bot">
   नमस्ते! मैं ARYA हूँ। मुझसे हिंदी, English या Hinglish में बात कर सकते हैं।
  </div>
 </div>
 <div class="composer">
  <input id="message" placeholder="अपना सवाल लिखें..." autocomplete="off">
  <button class="iconbtn" onclick="sendMessage()" aria-label="Send">➤</button>
 </div>
</section>

<section id="voiceMode">
 <div class="core-area">
  <div class="ring three"></div>
  <div class="ring two"></div>
  <div class="ring"></div>
  <div class="core"></div>
 </div>
 <div class="voice-title">ARYA VOICE</div>
 <div class="voice-hint" id="voiceHint">Mic दबाकर ARYA से बात करें</div>
 <div id="voiceTranscript"></div>
 <div class="voice-controls">
  <button class="primary" id="micBtn" onclick="startListening()">Mic</button>
  <button id="voiceToggleBtn" onclick="toggleVoice()">Voice ON</button>
  <button onclick="stopAll()">Stop</button>
 </div>
 <div class="voice-controls">
  <button onclick="switchMode('chat')">Back to Chat</button>
 </div>
</section>

<div id="historyPanel" onclick="if(event.target===this)closeHistory()">
 <div class="drawer">
  <div class="drawer-head">
   <h3>Chat History</h3>
   <button onclick="closeHistory()">✕</button>
  </div>
  <button onclick="newChat();closeHistory()">+ New Chat</button>
  <div id="historyList"></div>
  <button onclick="clearHistory()" style="margin-top:15px">Clear All History</button>
 </div>
</div>

<div id="memoryPanel">
 <div class="modal">
  <h3>ARYA Memory</h3>
  <p style="color:#aabbd2;font-size:13px">
   यहाँ लिखी जानकारी अगली बातचीत में ARYA को भेजी जाएगी।
  </p>
  <textarea id="memoryText" placeholder="अपनी पसंद या जरूरी जानकारी लिखें..."></textarea>
  <div class="modal-actions">
   <button onclick="closeMemory()">Cancel</button>
   <button class="primary" onclick="saveMemory()">Save Memory</button>
  </div>
 </div>
</div>

<script>
const API_URL="https://arya-backend-2.onrender.com/chat";

let currentMode="chat";
let conversation=[];
let voiceEnabled=true;
let recognition=null;
let listening=false;
let speaking=false;
let activeSessionId=Date.now().toString();

const $=id=>document.getElementById(id);

function escapeHTML(text){
 return String(text)
 .replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function formatInline(text){
 let safe=escapeHTML(text);
 const codes=[];

 safe=safe.replace(/`([^`]+)`/g,(m,c)=>{
  const k="CODETOKEN"+codes.length;
  codes.push("<code>"+c+"</code>");
  return k;
 });

 safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 safe=safe.replace(/__(.+?)__/g,"<strong>$1</strong>");
 safe=safe.replace(/\*(.+?)\*/g,"<em>$1</em>");
 safe=safe.replace(/_(.+?)_/g,"<em>$1</em>");

 safe=safe.replace(/(https?:\/\/[^\s<]+)/g,url=>{
  let clean=url,tail="";
  while(/[.,!?;:)]+$/.test(clean)){
   tail=clean.slice(-1)+tail;
   clean=clean.slice(0,-1);
  }
  try{
   const u=new URL(clean);
   if(!["http:","https:"].includes(u.protocol))return url;
  }catch{return url;}

  return '<a href="'+clean+'" target="_blank" rel="noopener noreferrer">'+clean+'</a>'+tail;
 });

 codes.forEach((c,i)=>safe=safe.replace("CODETOKEN"+i,c));
 return safe;
}

function markdownToHTML(text){
 const lines=String(text||"").replace(/\r/g,"").split("\n");
 let html="",paragraph=[],list=null,code=false,codeLines=[];

 function closeP(){
  if(paragraph.length){
   html+="<p>"+paragraph.map(formatInline).join("<br>")+"</p>";
   paragraph=[];
  }
 }

 function closeL(){
  if(list){html+="</"+list+">";list=null;}
 }

 for(let i=0;i<lines.length;i++){
  const t=lines[i].trim();

  if(t.startsWith("```")){
   closeP();closeL();
   if(code){
    html+="<pre><code>"+escapeHTML(codeLines.join("\n"))+"</code></pre>";
    codeLines=[];code=false;
   }else code=true;
   continue;
  }

  if(code){codeLines.push(lines[i]);continue;}
  if(!t){closeP();closeL();continue;}

  if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){
   closeP();closeL();html+="<hr>";continue;
  }

  const h=t.match(/^(#{1,3})\s+(.+)$/);
  if(h){
   closeP();closeL();
   const n=h[1].length;
   html+="<h"+n+">"+formatInline(h[2])+"</h"+n+">";
   continue;
  }

  if(t.startsWith(">")){
   closeP();closeL();
   html+="<blockquote>"+formatInline(t.replace(/^>\s?/,""))+"</blockquote>";
   continue;
  }

  const b=t.match(/^[-*•]\s+(.+)$/);
  const n=t.match(/^\d+[.)]\s+(.+)$/);

  if(b||n){
   closeP();
   const typ=b?"ul":"ol";
   if(list!==typ){closeL();html+="<"+typ+">";list=typ;}
   html+="<li>"+formatInline((b||n)[1])+"</li>";
   continue;
  }

  closeL();paragraph.push(lines[i]);
 }

 if(code)html+="<pre><code>"+escapeHTML(codeLines.join("\n"))+"</code></pre>";
 closeP();closeL();
 return html;
}

function addMessage(text,type,sources=[]){
 const div=document.createElement("div");
 div.className="message "+type;

 if(type==="user"){
  div.textContent=text;
 }else{
  div.innerHTML=markdownToHTML(text);

  if(Array.isArray(sources)&&sources.length){
   const box=document.createElement("div");
   box.className="sources";
   const title=document.createElement("strong");
   title.textContent="Sources";
   box.appendChild(title);

   sources.forEach((s,i)=>{
    const url=typeof s==="string"?s:(s.url||s.link||"");
    const name=typeof s==="string"?s:(s.title||s.name||url);

    try{
     const parsed=new URL(url);
     if(!["http:","https:"].includes(parsed.protocol))return;

     const a=document.createElement("a");
     a.href=parsed.href;
     a.target="_blank";
     a.rel="noopener noreferrer";
     a.textContent=(i+1)+". "+name;
     box.appendChild(a);
    }catch{}
   });

   if(box.children.length>1)div.appendChild(box);
  }
 }

 $("chat").appendChild(div);
 $("chat").scrollTop=$("chat").scrollHeight;
 return div;
}

function saveCurrent(){
 if(!conversation.length)return;

 let all=getSavedSessions();
 const existing=all.findIndex(x=>x.id===activeSessionId);

 const session={
  id:activeSessionId,
  title:(conversation.find(x=>x.role==="user")||{}).text||"New Chat",
  date:new Date().toLocaleString(),
  messages:conversation
 };

 if(existing>=0)all[existing]=session;
 else all.unshift(session);

 all=all.slice(0,50);
 localStorage.setItem("arya_chat_history_v1",JSON.stringify(all));
}

function getSavedSessions(){
 try{
  return JSON.parse(localStorage.getItem("arya_chat_history_v1")||"[]");
 }catch{
  return [];
 }
}

function getMemory(){
 return localStorage.getItem("arya_memory_v1")||"";
}

function saveMessage(role,text){
 conversation.push({role,text});
 saveCurrent();
}

function newChat(){
 saveCurrent();
 conversation=[];
 activeSessionId=Date.now().toString();
 $("chat").innerHTML="";
 addMessage("नमस्ते! मैं ARYA हूँ। आज मैं आपकी क्या मदद कर सकती हूँ?","bot");
 $("status").textContent="नई बातचीत शुरू हुई";
}

function clearHistory(){
 if(!confirm("क्या आप पूरी Chat History हटाना चाहते हैं?"))return;

 localStorage.removeItem("arya_chat_history_v1");
 conversation=[];
 activeSessionId=Date.now().toString();
 $("chat").innerHTML="";
 addMessage("नमस्ते! मैं ARYA हूँ।","bot");
 renderHistory();
 $("status").textContent="Chat History साफ हो गई";
}

function renderHistory(){
 const list=$("historyList");
 list.innerHTML="";
 const sessions=getSavedSessions();

 if(!sessions.length){
  list.textContent="अभी कोई पुरानी Chat नहीं है।";
  return;
 }

 sessions.forEach(s=>{
  const item=document.createElement("div");
  item.className="history-item";

  const title=document.createElement("div");
  title.textContent=s.title||"Chat";

  const date=document.createElement("small");
  date.textContent=s.date||"";

  item.append(title,date);
  item.onclick=()=>loadSession(s.id);
  list.appendChild(item);
 });
}

function openHistory(){
 renderHistory();
 $("historyPanel").classList.add("open");
}

function closeHistory(){
 $("historyPanel").classList.remove("open");
}

function loadSession(id){
 const session=getSavedSessions().find(x=>x.id===id);
 if(!session)return;

 conversation=Array.isArray(session.messages)?session.messages:[];
 activeSessionId=session.id;
 $("chat").innerHTML="";

 conversation.forEach(m=>
  addMessage(m.text,m.role==="user"?"user":"bot")
 );

 closeHistory();
 switchMode("chat");
 $("status").textContent="पुरानी Chat खोली गई";
}

function openMemory(){
 $("memoryText").value=getMemory();
 $("memoryPanel").classList.add("open");
}

function closeMemory(){
 $("memoryPanel").classList.remove("open");
}

function saveMemory(){
 localStorage.setItem("arya_memory_v1",$("memoryText").value.trim());
 closeMemory();
 $("status").textContent="Memory सुरक्षित हो गई";
}

function switchMode(mode){
 stopListening();

 if(mode!=="voice")stopSpeaking();

 currentMode=mode;
 $("chatMode").style.display=mode==="chat"?"flex":"none";
 $("voiceMode").classList.toggle("active",mode==="voice");
 $("chatModeBtn").classList.toggle("active",mode==="chat");
 $("voiceModeBtn").classList.toggle("active",mode==="voice");

 if(mode==="voice"){
  $("voiceHint").textContent="Mic दबाकर ARYA से बात करें";
  $("voiceTranscript").textContent="";
 }

 $("status").textContent=
  mode==="voice"?"Voice Mode तैयार है":"Chat Mode तैयार है";
}

function detectLanguage(text){
 const value=String(text||"");

 const hindi=(value.match(/[\u0900-\u097F]/g)||[]).length;
 const latin=(value.match(/[a-zA-Z]/g)||[]).length;

 if(hindi>0&&latin>0)return "Hinglish";
 if(hindi>0)return "Hindi";
 return "English";
}

async function askARYA(message){
 const history=conversation.slice(-12);
 const memory=getMemory();
 const lang=detectLanguage(message);

 const languageInstruction=
  "Reply in the same language and writing style as the user's latest message. "+
  "If Hindi, reply in Hindi. If English, reply in English. "+
  "If Hinglish, reply in natural Hinglish using the same script style. "+
  "Do not force Hindi when the user uses English. ";

 const response=await fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   message:languageInstruction+"User language detected: "+lang+
    ". User message: "+message,
   history:history,
   memory:memory
  })
 });

 let data={};
 try{data=await response.json();}catch{}

 if(!response.ok)throw new Error(data.reply||"Server error");
 return data;
}

let requestBusy=false;

async function sendMessage(){
 if(requestBusy)return;

 const input=$("message");
 const message=input.value.trim();
 if(!message)return;

 input.value="";
 await sendToARYA(message,false);
}

async function sendToARYA(message,fromVoice){
 if(requestBusy)return;

 requestBusy=true;
 addMessage(message,"user");
 saveMessage("user",message);

 $("status").textContent="ARYA सोच रही है...";
 if(fromVoice)$("voiceHint").textContent="ARYA जवाब तैयार कर रही है...";

 const loading=addMessage("जवाब तैयार हो रहा है...","bot");

 try{
  const data=await askARYA(message);
  const reply=data.reply||data.response||"जवाब नहीं मिला।";

  loading.innerHTML=markdownToHTML(reply);

  if(Array.isArray(data.sources)&&data.sources.length){
   const box=document.createElement("div");
   box.className="sources";

   const heading=document.createElement("strong");
   heading.textContent="Sources";
   box.appendChild(heading);

   data.sources.forEach((s,i)=>{
    const url=typeof s==="string"?s:(s.url||s.link||"");
    const title=typeof s==="string"?s:(s.title||s.name||url);

    try{
     const parsed=new URL(url);
     if(!["http:","https:"].includes(parsed.protocol))return;

     const a=document.createElement("a");
     a.href=parsed.href;
     a.target="_blank";
     a.rel="noopener noreferrer";
     a.textContent=(i+1)+". "+title;
     box.appendChild(a);
    }catch{}
   });

   if(box.children.length>1)loading.appendChild(box);
  }

  saveMessage("assistant",reply);
  $("status").textContent="ARYA ऑनलाइन है";

  if(fromVoice)speak(reply);

 }catch(error){
  loading.textContent=
   "माफ़ कीजिए, अभी जवाब नहीं मिल पाया। कृपया थोड़ी देर बाद कोशिश करें।";

  $("status").textContent="कनेक्शन में समस्या";
  $("voiceHint").textContent="कनेक्शन में समस्या। फिर कोशिश करें।";
  console.error("ARYA error:",error);

 }finally{
  requestBusy=false;
 }
}

$("message").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
function startListening(){
 const SpeechRecognition=
  window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  $("voiceHint").textContent=
   "इस Browser में Voice Recognition उपलब्ध नहीं है। Chrome में कोशिश करें।";
  return;
 }

 if(listening){
  stopListening();
  return;
 }

 stopSpeaking();

 recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.continuous=false;
 recognition.interimResults=true;

 let finalText="";

 recognition.onstart=()=>{
  listening=true;
  document.body.classList.add("listening");
  $("micBtn").textContent="Listening...";
  $("voiceHint").textContent="मैं सुन रही हूँ...";
 };

 recognition.onresult=e=>{
  let interim="";

  for(let i=e.resultIndex;i<e.results.length;i++){
   const part=e.results[i][0].transcript;

   if(e.results[i].isFinal){
    finalText+=part;
   }else{
    interim+=part;
   }
  }

  $("voiceTranscript").textContent=finalText+interim;
 };

 recognition.onerror=e=>{
  $("voiceHint").textContent=
   "आवाज़ पहचानने में समस्या: "+e.error;
 };

 recognition.onend=()=>{
  listening=false;
  document.body.classList.remove("listening");
  $("micBtn").textContent="Mic";

  const text=finalText.trim();

  if(text&&currentMode==="voice"){
   $("voiceHint").textContent="आपने कहा: "+text;
   sendToARYA(text,true);
  }else if(!text){
   $("voiceHint").textContent=
    "फिर से बोलने के लिए Mic दबाएँ।";
  }
 };

 try{
  recognition.start();
 }catch(error){
  listening=false;
  document.body.classList.remove("listening");
  $("micBtn").textContent="Mic";
 }
}

function stopListening(){
 if(recognition){
  try{
   recognition.stop();
  }catch{}
 }

 listening=false;
 document.body.classList.remove("listening");
 $("micBtn").textContent="Mic";
}

function speak(text){
 if(!("speechSynthesis" in window))return;

 stopSpeaking();

 const clean=String(text)
  .replace(/```[\s\S]*?```/g," code ")
  .replace(/https?:\/\/\S+/g,"")
  .replace(/[#*_>`|]/g," ")
  .replace(/\n+/g,". ");

 const utterance=new SpeechSynthesisUtterance(clean);
 const lang=detectLanguage(text);

 utterance.lang=lang==="English"?"en-IN":"hi-IN";
 utterance.rate=1;
 utterance.pitch=1;

 utterance.onstart=()=>{
  speaking=true;
  document.body.classList.add("speaking");
  $("voiceHint").textContent="ARYA बोल रही है...";
 };

 utterance.onend=()=>{
  speaking=false;
  document.body.classList.remove("speaking");
  $("voiceHint").textContent="जवाब पूरा हुआ। फिर बोल सकते हैं।";
 };

 utterance.onerror=()=>{
  speaking=false;
  document.body.classList.remove("speaking");
 };

 speechSynthesis.speak(utterance);
}

function stopSpeaking(){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
 }

 speaking=false;
 document.body.classList.remove("speaking");
}

function toggleVoice(){
 voiceEnabled=!voiceEnabled;
 $("voiceToggleBtn").textContent=
  voiceEnabled?"Voice ON":"Voice OFF";

 if(!voiceEnabled)stopSpeaking();
}

function stopAll(){
 stopListening();
 stopSpeaking();

 $("voiceHint").textContent=
  "रोक दिया गया। फिर से शुरू करने के लिए Mic दबाएँ।";

 $("status").textContent="Voice रुक गया";
}

/* Restore saved conversation */
function restoreLastSession(){
 const sessions=getSavedSessions();
 if(!sessions.length)return;

 const last=sessions[0];
 if(!last||!Array.isArray(last.messages))return;

 conversation=last.messages;
 activeSessionId=last.id;
 $("chat").innerHTML="";

 conversation.forEach(m=>{
  addMessage(m.text,m.role==="user"?"user":"bot");
 });
}

/* Initial setup */
restoreLastSession();
</script>
