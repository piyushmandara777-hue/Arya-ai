

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYA AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101522;
 color:white;
}

header{
 padding:20px;
 text-align:center;
 background:#18243a;
 border-bottom:1px solid #34445e;
}

header h1{margin:0;color:#54d6ff}
header p{margin:7px 0 0;color:#b9c7da}

#chat{
 max-width:750px;
 margin:auto;
 padding:15px;
 height:65vh;
 overflow-y:auto;
}

.message{
 padding:13px;
 margin:12px 0;
 border-radius:12px;
 line-height:1.65;
 overflow-wrap:anywhere;
}

.user{
 background:#245b82;
 margin-left:35px;
 white-space:pre-wrap;
}

.bot{
 background:#263249;
 margin-right:35px;
}

/* ARYA text formatting */

.bot p{
 margin:8px 0 12px;
}

.bot h1,.bot h2,.bot h3{
 color:#54d6ff;
 line-height:1.35;
 margin:16px 0 9px;
}

.bot h1{font-size:23px}
.bot h2{font-size:20px}
.bot h3{font-size:17px}

.bot strong{
 color:#fff;
 font-weight:700;
}

.bot em{
 font-style:italic;
}

.bot ul,.bot ol{
 padding-left:25px;
 margin:9px 0 13px;
}

.bot li{
 margin:6px 0;
}

.bot a{
 color:#54d6ff;
 text-decoration:underline;
 overflow-wrap:anywhere;
}

.bot blockquote{
 margin:12px 0;
 padding:8px 12px;
 border-left:3px solid #54d6ff;
 background:#1b2940;
 border-radius:5px;
 color:#d5e2f3;
}

.bot code{
 background:#111b2b;
 color:#75dcff;
 padding:2px 5px;
 border-radius:5px;
 font-family:Consolas,monospace;
}

.bot pre{
 background:#111b2b;
 padding:13px;
 border-radius:9px;
 overflow-x:auto;
 margin:12px 0;
 border:1px solid #34445e;
}

.bot pre code{
 background:none;
 padding:0;
 color:#d7eaff;
 white-space:pre;
}

.bot table{
 width:100%;
 border-collapse:collapse;
 margin:12px 0;
 font-size:14px;
}

.bot th,.bot td{
 border:1px solid #52627b;
 padding:8px;
 text-align:left;
}

.bot th{
 background:#18243a;
 color:#54d6ff;
}

.bot hr{
 border:0;
 border-top:1px solid #52627b;
 margin:15px 0;
}

footer{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:12px;
 background:#18243a;
 display:flex;
 gap:8px;
}

input{
 flex:1;
 min-width:0;
 padding:14px;
 border-radius:10px;
 border:1px solid #52627b;
 background:#101522;
 color:white;
 font-size:16px;
}

button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 background:#19b9e8;
 color:#061522;
 font-weight:bold;
}

#status{
 text-align:center;
 color:#9eabc0;
 padding:8px;
}
</style>
</head>

<body>

<header>
<h1>ARYA AI</h1>
<p>Your Personal AI Assistant</p>
</header>

<div id="status">ARYA तैयार है</div>

<div id="chat">
 <div class="message bot">
  नमस्ते! मैं ARYA हूँ। मुझसे हिंदी या English में कुछ भी पूछिए।
 </div>
</div>

<footer>
<input id="message" placeholder="अपना सवाल लिखें..." />
<button onclick="sendMessage()">Send</button>
</footer>

<script>
const API_URL = "https://arya-backend-2.onrender.com/chat";

/* HTML safe text */
function escapeHTML(text){
 return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

/* Inline Markdown */
function formatInline(text){
 let safe=escapeHTML(text);

 // Inline code
 const codeParts=[];
 safe=safe.replace(/`([^`]+)`/g,(match,code)=>{
  const key="INLINECODE"+codeParts.length+"TOKEN";
  codeParts.push("<code>"+code+"</code>");
  return key;
 });

 // Bold
 safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 safe=safe.replace(/__(.+?)__/g,"<strong>$1</strong>");

 // Italic
 safe=safe.replace(/\*(.+?)\*/g,"<em>$1</em>");
 safe=safe.replace(/_(.+?)_/g,"<em>$1</em>");

 // Links
 safe=safe.replace(
  /(https?:\/\/[^\s<]+)/g,
  function(url){
   let punctuation="";
   while(/[.,!?;:)]+$/.test(url)){
    punctuation=url.slice(-1)+punctuation;
    url=url.slice(0,-1);
   }

   return '<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>'+punctuation;
  }
 );

 // Restore inline code
 codeParts.forEach((code,index)=>{
  safe=safe.replace("INLINECODE"+index+"TOKEN",code);
 });

 return safe;
}

/* Markdown block formatting */
function markdownToHTML(text){
 const lines=String(text).replace(/\r/g,"").split("\n");
 let html="";
 let paragraph=[];
 let listType=null;
 let inCode=false;
 let codeLines=[];
 let i=0;

 function closeParagraph(){
  if(paragraph.length){
   html+="<p>"+paragraph.map(formatInline).join("<br>")+"</p>";
   paragraph=[];
  }
 }

 function closeList(){
  if(listType){
   html+="</"+listType+">";
   listType=null;
  }
 }

 function closeCode(){
  html+="<pre><code>"+escapeHTML(codeLines.join("\n"))+"</code></pre>";
  codeLines=[];
  inCode=false;
 }

 function isTableRow(line){
  return line.trim().startsWith("|") && line.trim().endsWith("|");
 }

 function cells(line){
  return line.trim().replace(/^\||\|$/g,"")
   .split("|").map(x=>x.trim());
 }

 function isTableDivider(line){
  return isTableRow(line) &&
   cells(line).every(x=>/^:?-{3,}:?$/.test(x));
 }

 while(i<lines.length){
  const line=lines[i];
  const trimmed=line.trim();

  // Code blocks
  if(trimmed.startsWith("```")){
   closeParagraph();
   closeList();

   if(inCode){
    closeCode();
   }else{
    inCode=true;
    codeLines=[];
   }
   i++;
   continue;
  }

  if(inCode){
   codeLines.push(line);
   i++;
   continue;
  }

  // Empty line
  if(!trimmed){
   closeParagraph();
   closeList();
   i++;
   continue;
  }

  // Horizontal line
  if(/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)){
   closeParagraph();
   closeList();
   html+="<hr>";
   i++;
   continue;
  }

  // Headings
  const heading=trimmed.match(/^(#{1,3})\s+(.+)$/);
  if(heading){
   closeParagraph();
   closeList();
   const level=heading[1].length;
   html+="<h"+level+">"+formatInline(heading[2])+"</h"+level+">";
   i++;
   continue;
  }

  // Tables
  if(isTableRow(trimmed) && i+1<lines.length && isTableDivider(lines[i+1].trim())){
   closeParagraph();
   closeList();

   const headers=cells(trimmed);
   html+="<table><thead><tr>";

   headers.forEach(cell=>{
    html+="<th>"+formatInline(cell)+"</th>";
   });

   html+="</tr></thead><tbody>";
   i+=2;

   while(i<lines.length && isTableRow(lines[i].trim())){
    const row=cells(lines[i]);
    html+="<tr>";

    headers.forEach((header,index)=>{
     html+="<td>"+formatInline(row[index]||"")+"</td>";
    });

    html+="</tr>";
    i++;
   }

   html+="</tbody></table>";
   continue;
  }

  // Blockquote
  if(trimmed.startsWith(">")){
   closeParagraph();
   closeList();
   html+="<blockquote>"+formatInline(trimmed.replace(/^>\s?/,""))+"</blockquote>";
   i++;
   continue;
  }

  // Unordered list
  const bullet=trimmed.match(/^[-*•]\s+(.+)$/);
  if(bullet){
   closeParagraph();

   if(listType!=="ul"){
    closeList();
    html+="<ul>";
    listType="ul";
   }

   html+="<li>"+formatInline(bullet[1])+"</li>";
   i++;
   continue;
  }

  // Ordered list
  const numbered=trimmed.match(/^\d+[.)]\s+(.+)$/);
  if(numbered){
   closeParagraph();

   if(listType!=="ol"){
    closeList();
    html+="<ol>";
    listType="ol";
   }

   html+="<li>"+formatInline(numbered[1])+"</li>";
   i++;
   continue;
  }

  // Normal paragraph
  closeList();
  paragraph.push(line);
  i++;
 }

 if(inCode)closeCode();

 closeParagraph();
 closeList();

 return html;
}

/* Send message */
async function sendMessage(){
 const input=document.getElementById("message");
 const status=document.getElementById("status");
 const message=input.value.trim();

 if(!message)return;

 addMessage(message,"user");
 input.value="";
 status.textContent="ARYA सोच रही है...";

 const loading=addMessage("जवाब तैयार हो रहा है...","bot");

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.reply || "Server error");
  }

  loading.innerHTML=markdownToHTML(data.reply || "जवाब नहीं मिला।");
  status.textContent="ARYA ऑनलाइन है";

 }catch(error){
  loading.textContent="माफ़ कीजिए, अभी जवाब नहीं मिल पाया। कृपया थोड़ी देर बाद कोशिश करें।";
  status.textContent="कनेक्शन में समस्या";
  console.error("ARYA error:",error);
 }
}

/* Add chat message */
function addMessage(text,type){
 const chat=document.getElementById("chat");
 const div=document.createElement("div");

 div.className="message "+type;

 if(type==="user"){
  div.textContent=text;
 }else{
  div.innerHTML=markdownToHTML(text);
 }

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;

 return div;
}

/* Enter key */
document.getElementById("message").addEventListener("keydown",function(e){
 if(e.key==="Enter")sendMessage();
});
</script>

</body>
</html>
